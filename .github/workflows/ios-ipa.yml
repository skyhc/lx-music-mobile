name: Build iOS IPA + Xcode Archive

on:
  push:
    branches:
      - ios-adaptation
      - ipad-landscape
      - codex/ipad-player-layout-cache-review
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: iOS IPA + Xcode Archive
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: com.skyhc.lxmusic
      IOS_TEAM_ID: LW54AZ8PXT
      DERIVED_DATA_PATH: build/DerivedData
      UNSIGNED_ARCHIVE_PATH: build/LxMusicMobile-unsigned.xcarchive

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Snapshot exact build source
        run: git archive --format=zip --output=../lx-build-source.zip HEAD

      - name: Upload build source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: ../lx-build-source.zip
          retention-days: 7
          if-no-files-found: error

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fix Swift compatibility libraries
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)/usr/lib/swift"
          LIBS=(libswiftCompatibility50.a libswiftCompatibility51.a libswiftCompatibility56.a libswiftCompatibilityConcurrency.a libswiftCompatibilityDynamicReplacements.a libswiftCompatibilityPacks.a)
          for LIB in "${LIBS[@]}"; do
            SRC="$TOOLCHAIN/$LIB"
            DST="$SDK/$LIB"
            TBD="${DST%.a}.tbd"
            if [ -f "$SRC" ] && [ ! -e "$DST" ] && [ ! -e "$TBD" ]; then
              sudo ln -s "$SRC" "$DST"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check iPad layout contracts
        run: |
          node scripts/check-ipad-player-layout.js
          node scripts/check-ipad-window-layout.js

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Read package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned Xcode archive
        shell: bash
        run: |
          mkdir -p build
          rm -rf "$UNSIGNED_ARCHIVE_PATH"
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$UNSIGNED_ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive 2>&1 | tee build/xcodebuild.log

      - name: Show first Xcode errors
        if: failure()
        shell: bash
        run: grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Attach distribution team metadata
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_INFO="$UNSIGNED_ARCHIVE_PATH/Info.plist"
          test -f "$ARCHIVE_INFO"
          if /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:Team' "$ARCHIVE_INFO" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Team $IOS_TEAM_ID" "$ARCHIVE_INFO"
          else
            /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Team string $IOS_TEAM_ID" "$ARCHIVE_INFO"
          fi

      - name: Verify iPad archive metadata
        shell: bash
        run: |
          set -euo pipefail
          test -d "$UNSIGNED_ARCHIVE_PATH"
          test -f "$UNSIGNED_ARCHIVE_PATH/Info.plist"
          APP_PATH="$(find "$UNSIGNED_ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:Team' "$UNSIGNED_ARCHIVE_PATH/Info.plist")" = "$IOS_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$IOS_BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "15.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$PACKAGE_VERSION_CODE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "$PACKAGE_VERSION"
          DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist")"
          echo "$DEVICE_FAMILY" | grep -q '1'
          echo "$DEVICE_FAMILY" | grep -q '2'
          test -s "$APP_PATH/main.jsbundle"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$UNSIGNED_ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          (cd build && zip -qry "lx-music-mobile-v${PACKAGE_VERSION}-build${PACKAGE_VERSION_CODE}-ios-unsigned.ipa" Payload)

      - name: Package Xcode archive for download
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_ZIP="build/LX-Music-v${PACKAGE_VERSION}-build${PACKAGE_VERSION_CODE}.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "$UNSIGNED_ARCHIVE_PATH" "$ARCHIVE_ZIP"
          test -s "$ARCHIVE_ZIP"
          (cd build && shasum -a 256 *.ipa *.xcarchive.zip > SHA256SUMS.txt)
          printf 'commit=%s\nrun=%s\nversion=%s\nbuild=%s\nsigning=unsigned\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PACKAGE_VERSION" "$PACKAGE_VERSION_CODE" > build/BUILD-METADATA.txt

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-v${{ env.PACKAGE_VERSION }}-build${{ env.PACKAGE_VERSION_CODE }}-unsigned
          path: |
            build/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-build${{ env.PACKAGE_VERSION_CODE }}-ios-unsigned.ipa
            build/SHA256SUMS.txt
            build/BUILD-METADATA.txt
          if-no-files-found: error

      - name: Upload Xcode archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-archive-v${{ env.PACKAGE_VERSION }}-build${{ env.PACKAGE_VERSION_CODE }}
          path: |
            build/LX-Music-v${{ env.PACKAGE_VERSION }}-build${{ env.PACKAGE_VERSION_CODE }}.xcarchive.zip
            build/SHA256SUMS.txt
            build/BUILD-METADATA.txt
          if-no-files-found: error
