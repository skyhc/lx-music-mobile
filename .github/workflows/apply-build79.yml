name: Apply verified Build 79 source repair
on:
  push:
    branches: [codex/ipad-player-layout-cache-review]
    paths: ['scripts/build79-repair.part*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source base and patch checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "957fb59ff4c9b08c8cc6c7213204385d76dae285"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          data = b''.join(Path(f'scripts/build79-repair.part{i}').read_bytes() for i in range(3))
          assert hashlib.sha256(data).hexdigest() == 'e58fbd0571f289c041c5ec2f8bd07b05ec5c002fe808e9a42d3f77708295d2ee'
          Path('/tmp/build79.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --check /tmp/build79.patch
          git apply /tmp/build79.patch
      - name: Commit verified application source
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/build79-repair.part0 scripts/build79-repair.part1 scripts/build79-repair.part2
          git add src ios scripts docs package.json
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m "fix(ios): restore nonblocking playback and responsive single-row library in Build 79"
          git push origin "HEAD:${GITHUB_REF_NAME}"
