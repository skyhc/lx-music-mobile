name: Apply reviewed Build 85 source
on:
  push:
    branches: ['codex/ios-upstream-1.9.0']
    paths: ['.build85-source.*', '.github/workflows/apply-build85.yml']
permissions:
  contents: write
jobs:
  apply:
    if: "startsWith(github.event.head_commit.message, 'ci: stage Build 85')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a6b23358eac2cb419b165b5b7bbf122b05ec3ead'
          cat .build85-source.{01..12} > /tmp/build85.patch.gz
          echo '45f10be07791771657128feb3a383696864a78dae42e17e095fd15ff834bf284  /tmp/build85.patch.gz' | sha256sum -c -
          gzip -dc /tmp/build85.patch.gz > /tmp/build85.patch
          if grep -q '^diff --git a/.github/' /tmp/build85.patch; then echo 'Workflow changes must use the authorized connector'; exit 1; fi
          git apply --check --unidiff-zero /tmp/build85.patch
          git apply --index --unidiff-zero /tmp/build85.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 43
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m 'fix(ios): preserve Android sync protocol with async native crypto and theme-aware playing text in Build 85'
          git push origin HEAD:codex/ios-upstream-1.9.0
