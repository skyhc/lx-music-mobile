name: Apply reviewed Build 86 visual correction
on:
  push:
    branches: ['codex/ios-upstream-1.9.0']
    paths: ['.build86-reviewed-*.patch', '.github/workflows/apply-build86.yml']
permissions:
  contents: write
jobs:
  apply:
    if: "startsWith(github.event.head_commit.message, 'ci: stage Build 86')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply reviewed application files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f90fc24ad904fb0bbaa80e765cc7f3c76664e8d5'
          cat .build86-reviewed-0{0,1,2,3,4,5}.patch > /tmp/build86.patch
          echo '7daef8de0139f4864781e322e1c6b59c20229ddab3df1973068ea34655b9a03c  /tmp/build86.patch' | sha256sum -c -
          # Workflow edits are published by the GitHub connector separately;
          # the runner token is scoped to repository contents, not workflows.
          git apply --check --exclude=.github/workflows/ios-ipa.yml /tmp/build86.patch
          git apply --index --exclude=.github/workflows/ios-ipa.yml /tmp/build86.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 18
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m 'fix(ui): restore upstream heading backgrounds and distinguish playing text from body text'
          git push origin HEAD:codex/ios-upstream-1.9.0
