name: Build88 transport reconstruction

on:
  push:
    branches:
      - codex/build88-webdav-download

permissions:
  contents: write

env:
  BASE_COMMIT: d2f36ee2bb6e2785dcc9e57dba5e8ec8f985dfcf
  BASE_TREE: c18ec083b84bcd32bcd39ee4c30144d07a1ed4b4
  EXPECTED_GZIP_SHA256: e7c58bd5337837c17de57c836abc5168c11672d3538be0309c7313554bd5d4e1
  EXPECTED_GZIP_BYTES: '118404'
  EXPECTED_PATCH_SHA256: 1a689496891cbfd7dc5522d38337cbeed00d1696e5484cc14a52071bbedeab22
  EXPECTED_PATCH_BYTES: '420309'
  EXPECTED_APP_TREE: 288f61a4fe105cede0172e49ddcc2c21419fe5f2
  EXPECTED_CHANGED_FILES: '64'

jobs:
  reconstruct-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact application baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_COMMIT }}
          path: app
          fetch-depth: 1

      - name: Reconstruct and verify authoritative Build88 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root = Path('.github/build88-transport')

          def text(name: str) -> str:
              return (root / name).read_text(encoding='ascii')

          p1 = text('piece-01.b64')
          p2_bad = text('piece-02.b64')
          gap = text('piece-02-gap.txt')
          p3_bad = text('piece-03.b64')
          p4_bad = text('piece-04.b64')
          p5_bad = text('piece-05.b64')
          p6 = text('piece-06.b64')

          assert len(p2_bad) == 9462, len(p2_bad)
          assert len(gap) == 1206, len(gap)
          assert p3_bad.count('m83v3gqzt+vX59') == 1
          assert p4_bad.count('OjJVxky') == 1
          assert p5_bad.count('YFzs/mBB') == 1

          p2 = p2_bad[:1269] + gap + p2_bad[1269:]
          p3 = p3_bad.replace('m83v3gqzt+vX59', 'm83v3gqztvX59', 1)
          p4 = p4_bad.replace('OjJVxky', 'OjJVx9Hyky', 1)
          p5 = p5_bad.replace('YFzs/mBB', 'YFzs/mzBB', 1)

          def git_blob_sha(s: str) -> str:
              b = s.encode('ascii')
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()

          corrected = {
              'piece-02.b64': (p2, '2a22712a1d0c6031aecefb17dd55c6df2cf99547'),
              'piece-03.b64': (p3, '3b41f2cc957ccc949117a0a4102125cdfd8a575e'),
              'piece-04.b64': (p4, '033121ddff40b42fa4a77c6e4a88316f3c2de675'),
              'piece-05.b64': (p5, 'f6715a7f8a4f84fe7ddeb020865b979422f3356e'),
          }
          for name, (value, expected) in corrected.items():
              actual = git_blob_sha(value)
              if actual != expected:
                  raise SystemExit(f'{name}: corrected blob mismatch {actual} != {expected}')

          segments = [p1, p2, p3, p4, p5, p6]
          segments += [text(f'part-{i:02d}.b64') for i in range(1, 9)]
          segments += [text(f'tail-{i:03d}.b64') for i in range(1, 122)]

          binary = bytearray()
          for idx, segment in enumerate(segments, 1):
              try:
                  binary.extend(base64.b64decode(segment, validate=True))
              except Exception as exc:
                  raise SystemExit(f'base64 segment {idx} invalid: {exc}') from exc

          gzip_bytes = bytes(binary)
          gzip_sha = hashlib.sha256(gzip_bytes).hexdigest()
          if len(gzip_bytes) != int('${{ env.EXPECTED_GZIP_BYTES }}'):
              raise SystemExit(f'gzip length mismatch: {len(gzip_bytes)}')
          if gzip_sha != '${{ env.EXPECTED_GZIP_SHA256 }}':
              raise SystemExit(f'gzip sha mismatch: {gzip_sha}')

          patch = gzip.decompress(gzip_bytes)
          patch_sha = hashlib.sha256(patch).hexdigest()
          if len(patch) != int('${{ env.EXPECTED_PATCH_BYTES }}'):
              raise SystemExit(f'patch length mismatch: {len(patch)}')
          if patch_sha != '${{ env.EXPECTED_PATCH_SHA256 }}':
              raise SystemExit(f'patch sha mismatch: {patch_sha}')

          Path('build88-batch.patch').write_bytes(patch)
          print(f'GZIP_OK bytes={len(gzip_bytes)} sha256={gzip_sha}')
          print(f'PATCH_OK bytes={len(patch)} sha256={patch_sha}')
          PY

      - name: Apply patch to exact baseline and verify deterministic app tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$BASE_COMMIT"
          git -C app apply --check --binary "$GITHUB_WORKSPACE/build88-batch.patch"
          git -C app apply --index --binary "$GITHUB_WORKSPACE/build88-batch.patch"
          changed="$(git -C app diff --cached --name-only | wc -l | tr -d ' ')"
          test "$changed" = "$EXPECTED_CHANGED_FILES"
          tree="$(git -C app write-tree)"
          test "$tree" = "$EXPECTED_APP_TREE"
          echo "APP_TREE_OK files=$changed tree=$tree"

      - name: Upload verified application blobs and create unreferenced target tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, subprocess, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          token = os.environ['GH_TOKEN']
          base_commit = os.environ['BASE_COMMIT']
          base_tree = os.environ['BASE_TREE']
          expected_tree = os.environ['EXPECTED_APP_TREE']
          expected_count = int(os.environ['EXPECTED_CHANGED_FILES'])

          def git(*args: str, text=True):
              p = subprocess.run(['git', '-C', 'app', *args], check=True, capture_output=True)
              return p.stdout.decode('utf-8') if text else p.stdout

          def post(path: str, payload: dict) -> dict:
              data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              req = urllib.request.Request(
                  f'{api}/repos/{repo}{path}',
                  data=data,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'build88-transport-reconstruction',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')[:1200]
                  raise SystemExit(f'GitHub API POST {path} failed HTTP {exc.code}: {body}') from exc

          raw = git('diff', '--cached', '--name-only', '-z', text=False)
          paths = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          if len(paths) != expected_count:
              raise SystemExit(f'changed path count mismatch: {len(paths)} != {expected_count}')

          entries = []
          report_files = []
          for idx, path in enumerate(paths, 1):
              ls = git('ls-files', '-s', '--', path).strip()
              if not ls:
                  raise SystemExit(f'missing index entry: {path}')
              left, indexed_path = ls.split('\t', 1)
              mode, local_sha, stage = left.split()
              if stage != '0' or indexed_path != path:
                  raise SystemExit(f'unexpected index entry for {path}: {ls}')
              data = (Path('app') / path).read_bytes()
              obj = post('/git/blobs', {
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              })
              remote_sha = obj.get('sha')
              if remote_sha != local_sha:
                  raise SystemExit(f'blob sha mismatch for {path}: {remote_sha} != {local_sha}')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': remote_sha})
              report_files.append({'path': path, 'mode': mode, 'sha': remote_sha, 'bytes': len(data)})
              print(f'BLOB_OK {idx:02d}/{expected_count} {remote_sha} {path}')

          tree_obj = post('/git/trees', {'base_tree': base_tree, 'tree': entries})
          remote_tree = tree_obj.get('sha')
          if remote_tree != expected_tree:
              raise SystemExit(f'remote tree mismatch: {remote_tree} != {expected_tree}')

          report = {
              'schema': 1,
              'repository': repo,
              'base_commit': base_commit,
              'base_tree': base_tree,
              'changed_files': len(report_files),
              'target_tree': remote_tree,
              'expected_target_tree': expected_tree,
              'gzip_bytes': int(os.environ['EXPECTED_GZIP_BYTES']),
              'gzip_sha256': os.environ['EXPECTED_GZIP_SHA256'],
              'patch_bytes': int(os.environ['EXPECTED_PATCH_BYTES']),
              'patch_sha256': os.environ['EXPECTED_PATCH_SHA256'],
              'files': report_files,
          }
          Path('build88-transport-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'TARGET_TREE_OK tree={remote_tree} files={len(report_files)}')
          PY

      - name: Upload safe reconstruction report
        uses: actions/upload-artifact@v4
        with:
          name: build88-transport-report
          path: build88-transport-report.json
          if-no-files-found: error
          retention-days: 7
