name: Apply verified Build 80 repairs
on:
  push:
    branches: [codex/ipad-player-layout-cache-review]
    paths: ['ci/build80.part*', .github/workflows/apply-build80.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "startsWith(github.event.head_commit.message, 'ci: stage Build 79-to-80')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete source manifest and apply exact changes
        env:
          TARGET_BRANCH: codex/ipad-player-layout-cache-review
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f37e95c35ced720d3eafea1d4ae59808975f0632 HEAD
          git diff --exit-code f37e95c35ced720d3eafea1d4ae59808975f0632 HEAD -- . ':(exclude).github/workflows/apply-build80.yml' ':(exclude)ci/build80.part*'
          python3 - <<'PY'
          import base64, lzma, hashlib, json, pathlib
          text = ''.join(p.read_text() for p in sorted(pathlib.Path('ci').glob('build80.part*')))
          raw = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '5aef9e973a033174658c93c2b8ebccab032983b22384a67762c466b25ef1a47e', 'Source manifest checksum mismatch'
          manifest = json.loads(raw)
          assert manifest['base'] == 'f37e95c35ced720d3eafea1d4ae59808975f0632'
          assert len(manifest['files']) == 57
          changes = []
          seen = set()
          for entry in manifest['files']:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.as_posix() not in seen and not path.is_symlink()
              seen.add(path.as_posix())
              before = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest() == entry['before'], f'Base changed: {path}'
              lines = before.decode('utf-8').splitlines(keepends=True)
              boundary = len(lines)
              for start, end, replacement in reversed(entry['ops']):
                  assert 0 <= start <= end <= boundary
                  lines[start:end] = replacement.splitlines(keepends=True)
                  boundary = start
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], f'Output mismatch: {path}'
              if path.parts[:2] != ('.github', 'workflows'):
                  changes.append((path, after))
          for path, data in changes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print(f'Verified all 57 files; applied {len(changes)} non-workflow files')
          PY
          git add -- .
          git diff --cached --check
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m 'fix(ios): restore legible tables, durable removal and unity gain in Build 80'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD
