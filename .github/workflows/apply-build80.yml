name: Apply verified Build 80 repairs
on:
  push:
    branches: [codex/ipad-player-layout-cache-review]
    paths: [ci/build80.part1, ci/build80.part2, .github/workflows/apply-build80.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.event.head_commit.message, 'ci: stage Build 79-to-80')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact patch and parent, then commit source
        env:
          TARGET_BRANCH: codex/ipad-player-layout-cache-review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f37e95c35ced720d3eafea1d4ae59808975f0632
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          text = pathlib.Path('ci/build80.part1').read_text() + pathlib.Path('ci/build80.part2').read_text()
          patch = gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == 'b14e5c296ca92b430253d2bd535f7b8f690d50b76d28f30ddaf901e45ca932cc', 'Patch checksum mismatch'
          pathlib.Path('/tmp/lx-build80.patch').write_bytes(patch)
          PY
          git apply --check /tmp/lx-build80.patch
          git apply --index /tmp/lx-build80.patch
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m 'fix(ios): restore legible tables, durable removal and unity gain in Build 80'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD
