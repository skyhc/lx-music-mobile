name: Build88 incremental regression
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/check-player-bar-theme.js'
      - '.github/workflows/build88-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-player-bar-theme.js
