name: Audit pinned upstream 1.9.0
on:
  push:
    branches: ['codex/ios-upstream-1.9.0']
    paths: ['.github/workflows/upstream-190-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact upstream and export history without credentials
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/lyswhut/lx-music-mobile.git
          git fetch upstream refs/tags/v1.9.0:refs/tags/audit-upstream-v1.9.0
          test "$(git rev-parse audit-upstream-v1.9.0^{commit})" = 'cd37a979a5845f1220b306b374285f5d38329e8d'
          git branch audit-ios-baseline 3f008d3599f29ceeaf7925e5935882a78a3052ff
          git branch audit-upstream cd37a979a5845f1220b306b374285f5d38329e8d
          mkdir -p audit
          git bundle create audit/lx-upstream-audit.bundle refs/heads/audit-ios-baseline refs/heads/audit-upstream
          git merge-base audit-ios-baseline audit-upstream > audit/merge-base.txt
          git diff --stat "$(cat audit/merge-base.txt)" audit-upstream > audit/upstream-stat.txt
          git log --oneline "$(cat audit/merge-base.txt)"..audit-upstream > audit/upstream-commits.txt
          sha256sum audit/lx-upstream-audit.bundle > audit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-190-merge-audit
          path: audit/
          retention-days: 7
          if-no-files-found: error
