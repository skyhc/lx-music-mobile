name: Apply reviewed Build 82 source
on:
  push:
    branches: [codex/ipad-player-layout-cache-review]
    paths: ['.build82-source.*']
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'ci: stage Build 82')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact checksum-verified UI source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ca37322e62255734e017aab8fac57b5e81f7724c"
          cat .build82-source.{01..12} > /tmp/build82.patch.gz
          echo '27b79fdfeeda2d9dddfb1a22eb134f73b22e00367027c3ea8ac72fa669cd76cb  /tmp/build82.patch.gz' | sha256sum -c -
          gzip -dc /tmp/build82.patch.gz > /tmp/build82.patch
          if grep -q '^diff --git a/.github/' /tmp/build82.patch; then echo 'Workflow changes must use the authorized connector'; exit 1; fi
          git apply --check --unidiff-zero /tmp/build82.patch
          git apply --index --unidiff-zero /tmp/build82.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 27
          git config user.name skyhc
          git config user.email 61585718+skyhc@users.noreply.github.com
          git commit -m 'fix(ipados): scene-based compact window chrome, dark appearance and complete menus in Build 82'
          git push origin HEAD:codex/ipad-player-layout-cache-review
