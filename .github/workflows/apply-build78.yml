name: Apply verified Build 78 source repair
on:
  push:
    branches: [codex/ipad-player-layout-cache-review]
    paths: ['ci/repairs/build78.part*']
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ipad-player-layout-cache-review
          fetch-depth: 0
      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          chunks = [pathlib.Path(f'ci/repairs/build78.part{i}').read_text() for i in range(5)]
          patch = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2562cea058054c697c658cf94b8c43993daf3fe6a202d63c44177e1822c77e98'
          path = pathlib.Path('/tmp/build78.patch')
          path.write_bytes(patch)
          changes = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True)
          for line in changes.splitlines():
              name = line.split('\t', 2)[2]
              assert name.startswith(('src/', 'ios/', 'scripts/', 'docs/')) or name == 'package.json', name
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ios scripts docs package.json
          git commit -m 'fix(ipad): finish persistent audio cache and window-safe left-panel UI; build 78'
          git push origin HEAD:refs/heads/codex/ipad-player-layout-cache-review
          git rev-parse HEAD
